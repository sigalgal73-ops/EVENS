<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Even's – תצוגה מקדימה</title>
</head>
<body style="font-family:Arial;background:#f5efe6;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
  <div style="text-align:center;padding:40px;">
    <div style="font-size:48px;">🌿</div>
    <h1 style="color:#3d5c2e;">Even's – תצוגה מקדימה</h1>
    <p style="color:#7a6a5a;">לחץ על הכפתור הירוק בפינה השמאלית התחתונה</p>
  </div>
  <form name="evens-lead" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="evens-lead"/>
    <input type="text" name="name"/><input type="text" name="phone"/>
    <input type="email" name="email"/><input type="text" name="company"/>
    <input type="text" name="eventCategory"/><input type="text" name="eventType"/>
    <input type="text" name="date"/><input type="text" name="hours"/>
    <input type="text" name="size"/><input type="text" name="consent"/>
  </form>
  <script src="evens-bot.js"></script>
</body>
</html>
